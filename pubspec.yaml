name: blossom_upload_queue_shim_for_ndk
description: >-
  Offline-first wrapper around the ndk package's Blossom upload use case.
  Persists per-upload metadata to a pluggable queue store (sembast included),
  reads blob bytes from a blossom_cache, and retries until every targeted
  server has acknowledged delivery.
version: 0.11.1
repository: https://github.com/nogringo/blossom-upload-queue-shim-for-ndk
issue_tracker: https://github.com/nogringo/blossom-upload-queue-shim-for-ndk/issues

topics:
  - nostr
  - ndk
  - blossom
  - offline-first
  - queue

environment:
  sdk: ^3.11.5

dependencies:
  blossom_cache: ^0.5.0
  ndk: '>=0.10.0-dev.7 <0.12.0'
  sembast: ^3.8.7
  url_set_for_ndk: '>=0.1.0 <0.3.0'

dev_dependencies:
  idb_shim: ^2.9.2
  lints: ^6.0.0
  test: ^1.25.6
